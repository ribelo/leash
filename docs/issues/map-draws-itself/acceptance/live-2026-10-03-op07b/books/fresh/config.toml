[chrome]
binary = "/etc/profiles/per-user/ribelo/bin/google-chrome-stable"
profile_dir = "<PRIVATE_ROOT>/profile"
workspace = "test"
headless = true
[tabs]
cap = 8
[expiry]
idle_s = 3600
tombstone_s = 3600
[models]
jev_model = "typesafe/jev-1.13-20260917"
