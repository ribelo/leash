systemone_endpoint = "https://openrouter.ai/api/v1/systemone"
chat_base_url = "https://openrouter.ai/api/v1"
[learning]
mode = "off"
successes = 2
timeout_s = 900
planner_model = "openai/gpt-6-luna"
planner_reasoning = "max"
[handoff]
timeout_s = 10
focus_command = []
notify_command = []
[challenges]
attempt = false
